<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F3EDE4">
<title>Orçamento — Beatriz Machado</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Outfit;src:url(/assets/fonts/outfit-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Inclusive Sans";src:url(/assets/fonts/inclusive-sans-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Inclusive Sans";src:url(/assets/fonts/inclusive-sans-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
:root{--bg:#F3EDE4;--card:#FBF8F3;--ink:#1A1A1A;--mut:#5B534B;--line:#DDD2C2;--terra:#C26A4A;--tink:#9A4B2E;--tbtn:#A65135;--tsoft:#F2DED2;--ok:#2F6B47;--oksoft:#DCEBDF}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.55 "Inclusive Sans",system-ui,sans-serif;padding:40px 16px 60px;overflow-x:hidden}
.o{position:fixed;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:0}.o.a{width:460px;height:460px;left:-150px;top:120px;background:rgba(194,106,74,.12)}.o.b{width:520px;height:520px;right:-160px;bottom:-120px;background:rgba(229,199,170,.3)}
.sheet{position:relative;z-index:1;max-width:820px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:48px 52px;box-shadow:0 40px 80px -50px rgba(26,26,26,.4)}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap;margin-bottom:36px}
.wm{font:700 26px/1 Outfit,sans-serif;letter-spacing:-.04em;color:var(--ink);text-decoration:none}.wm span{color:var(--terra)}
.wm-sub{display:block;font-size:13px;color:var(--mut);margin-top:8px}
.num{text-align:right}.num b{display:block;font:600 13px "Inclusive Sans";letter-spacing:.14em;text-transform:uppercase;color:var(--tink)}.num span{display:block;font:500 22px Outfit,sans-serif;margin-top:4px}.num small{display:block;color:var(--mut);font-size:13px;margin-top:4px}
h1{font:600 clamp(28px,4vw,40px)/1.05 Outfit,sans-serif;letter-spacing:-.025em;margin:0 0 6px}
.lead{color:var(--mut);margin:0 0 28px}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:30px}
.meta div{background:var(--bg);border-radius:16px;padding:14px 16px}.meta small{display:block;font-size:12px;font-weight:600;color:var(--mut);letter-spacing:.04em}.meta b{display:block;font-weight:600;margin-top:2px;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse;margin-bottom:8px}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);padding:0 10px 10px;border-bottom:1px solid var(--line)}
td{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td small{display:block;color:var(--mut);font-size:13px;margin-top:3px;white-space:pre-line}
.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{padding-left:0}th:last-child,td:last-child{padding-right:0}
.tot{display:flex;justify-content:flex-end;margin:18px 0 30px}.tot div{min-width:280px}
.tot p{display:flex;justify-content:space-between;margin:0;padding:6px 0;color:var(--mut)}
.tot p.big{border-top:2px solid var(--ink);margin-top:6px;padding-top:12px;color:var(--ink);font:600 22px Outfit,sans-serif}
.cond{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px}
.step{border:1px solid var(--line);border-radius:18px;padding:16px 18px}.step small{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tink)}
.step b{display:block;font:600 24px Outfit,sans-serif;margin:4px 0 2px}.step span{font-size:13.5px;color:var(--mut)}
.step.ok{background:var(--oksoft);border-color:#B9D6C1}.step.ok small{color:var(--ok)}
.notes{background:var(--bg);border-radius:16px;padding:16px 18px;margin-bottom:24px;white-space:pre-line;font-size:14.5px}
.pay{border-radius:22px;background:var(--ink);color:#fff;padding:26px 28px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.pay h2{font:600 22px Outfit,sans-serif;margin:0 0 4px}.pay p{margin:0;color:rgba(255,255,255,.75);font-size:14px}
.pay.done{background:var(--oksoft);color:var(--ink)}.pay.done p{color:var(--mut)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 26px;border-radius:999px;background:var(--tbtn);color:#fff;font:600 15px "Inclusive Sans";text-decoration:none;border:0;cursor:pointer;transition:background .2s,transform .2s;white-space:nowrap}
.btn:hover{background:#C26A4A;transform:translateY(-1px)}
.btn.s{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.s:hover{border-color:var(--ink);background:transparent}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:28px;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
.foot a{color:var(--tink)}
.banner{max-width:820px;margin:0 auto 18px;position:relative;z-index:1;background:var(--oksoft);border:1px solid #B9D6C1;color:var(--ok);border-radius:18px;padding:14px 20px;font-weight:600}
.msg{max-width:520px;margin:12vh auto;text-align:center;position:relative;z-index:1}
.tools{max-width:820px;margin:18px auto 0;display:flex;justify-content:flex-end;position:relative;z-index:1}
@media (max-width:700px){.sheet{padding:28px 20px;border-radius:22px}.meta,.cond{grid-template-columns:1fr}.num{text-align:left}.tot div{min-width:0;width:100%}
  th.hq,td.hq,th.hu,td.hu{display:none}}
@media print{body{background:#fff;padding:0}.o,.tools,.banner,.pay .btn{display:none!important}.sheet{border:0;box-shadow:none;padding:0;max-width:none}.pay{background:#fff;color:var(--ink);border:1px solid var(--line)}.pay p{color:var(--mut)}}
</style></head><body><i class="o a"></i><i class="o b"></i><div id="app"><p class="msg">A carregar o orçamento…</p></div>
<script>
(function(){
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function eur(n){n=+n||0;return n.toLocaleString("pt-PT",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+"€";}
function d(iso){var x=new Date(iso);return isNaN(x)?"":x.toLocaleDateString("pt-PT",{day:"numeric",month:"long",year:"numeric"});}
var P=new URLSearchParams(location.search),tok=P.get("t"),app=document.getElementById("app");
function render(D){var q=D.quote,s=D.sinal,f=D.final,half=Math.round(q.total*100/2)/100,rest=Math.round((q.total-half)*100)/100;
  var exp=new Date(new Date(q.sentAt).getTime()+q.validade*864e5),expired=Date.now()>exp&&!(s&&s.status==="paid");
  document.title="Orçamento "+q.number+" — Beatriz Machado";
  var o=(P.get("pago")?'<div class="banner">Obrigada! Recebi o teu pagamento. Se pagaste por Multibanco, fica confirmado assim que for pago.</div>':'')+
  '<main class="sheet"><div class="top"><div><a class="wm" href="/">beatriz machado<span>.</span></a><span class="wm-sub">Websites · Identidade Visual · Gestão de Redes Sociais</span></div>'+
  '<div class="num"><b>Orçamento</b><span>'+esc(q.number)+'</span><small>'+esc(d(q.sentAt))+' · válido até '+esc(d(exp))+'</small></div></div>'+
  '<h1>'+esc(D.service||"Proposta")+'</h1><p class="lead">Preparado para '+esc(D.client.nome)+(D.client.marca?' · '+esc(D.client.marca):'')+'.</p>'+
  '<div class="meta"><div><small>Cliente</small><b>'+esc(D.client.nome)+'</b>'+(D.client.email?'<span style="font-size:13px;color:var(--mut)">'+esc(D.client.email)+'</span>':'')+'</div><div><small>Prazo</small><b>'+esc(q.prazo||"A combinar")+'</b></div><div><small>Total</small><b>'+eur(q.total)+'</b></div></div>'+
  '<table><thead><tr><th>Descrição</th><th class="r hq">Qtd.</th><th class="r hu">Preço</th><th class="r">Total</th></tr></thead><tbody>'+
  q.items.map(function(x){return '<tr><td><b>'+esc(x.d)+'</b>'+(x.det?'<small>'+esc(x.det)+'</small>':'')+'</td><td class="r hq">'+x.q+'</td><td class="r hu">'+eur(x.v)+'</td><td class="r"><b>'+eur(x.q*x.v)+'</b></td></tr>';}).join("")+'</tbody></table>'+
  '<div class="tot"><div><p><span>Subtotal</span><span>'+eur(q.total)+'</span></p><p class="big"><span>Total</span><span>'+eur(q.total)+'</span></p></div></div>'+
  '<div class="cond"><div class="step'+(s&&s.status==="paid"?" ok":"")+'"><small>'+(s&&s.status==="paid"?"✓ Pago · ":"1. ")+'Para começar</small><b>'+eur(half)+'</b><span>50% na aprovação do orçamento</span></div>'+
  '<div class="step'+(f&&f.status==="paid"?" ok":"")+'"><small>'+(f&&f.status==="paid"?"✓ Pago · ":"2. ")+'Na entrega</small><b>'+eur(rest)+'</b><span>50% quando o projeto estiver pronto</span></div></div>'+
  (q.notas?'<div class="notes">'+esc(q.notas)+'</div>':'');
  if(f&&f.status==="paid")o+='<div class="pay done"><div><h2>Pago na totalidade</h2><p>Obrigada pela confiança!</p></div></div>';
  else if(f&&f.url)o+='<div class="pay"><div><h2>O teu projeto está pronto</h2><p>Falta o pagamento final de '+eur(f.amount)+'. Cartão, MB WAY ou Multibanco.</p></div><a class="btn" href="'+esc(f.url)+'">Pagar '+eur(f.amount)+'</a></div>';
  else if(f&&f.status==="waiting")o+='<div class="pay"><div><h2>Referência Multibanco gerada</h2><p>Assim que o pagamento final for feito, recebes tudo o que é teu.</p></div></div>';
  else if(s&&s.status==="paid")o+='<div class="pay done"><div><h2>Orçamento aprovado. Já estou a trabalhar no teu projeto.</h2><p>Os restantes '+eur(rest)+' são pagos só na entrega.</p></div></div>';
  else if(s&&s.status==="waiting")o+='<div class="pay"><div><h2>Referência Multibanco gerada</h2><p>Começo o projeto assim que o pagamento do sinal for confirmado.</p></div></div>';
  else if(expired)o+='<div class="pay"><div><h2>Este orçamento expirou</h2><p>Fala comigo para o atualizar: beatrizmachadostudio@gmail.com</p></div></div>';
  else if(s&&s.url)o+='<div class="pay"><div><h2>Para avançar, aprova o orçamento</h2><p>Pagas agora 50% ('+eur(half)+') e o restante só na entrega. Cartão, MB WAY ou Multibanco.</p></div><a class="btn" href="'+esc(s.url)+'">Aprovar e pagar '+eur(half)+'</a></div>';
  o+='<div class="foot"><span>Beatriz Machado · Websites, Identidade Visual e Redes Sociais</span><span><a href="mailto:beatrizmachadostudio@gmail.com">beatrizmachadostudio@gmail.com</a> · <a href="/">beatrizstudio.pt</a></span></div></main>'+
     '<div class="tools"><button class="btn s" onclick="print()">Guardar em PDF</button></div>';
  app.innerHTML=o;}
if(window.QUOTE_DATA){render(window.QUOTE_DATA);return;}
if(!tok){app.innerHTML='<p class="msg">Link incompleto.</p>';return;}
fetch("/api/admin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"quote-view",token:tok})}).then(function(r){return r.json();}).then(function(j){if(!j.ok){app.innerHTML='<div class="msg"><h1>Orçamento indisponível</h1><p>'+esc(j.error||"")+'</p><a class="btn" href="/">Ir para o site</a></div>';return;}render(j);},function(){app.innerHTML='<p class="msg">Sem ligação. Tenta de novo.</p>';});
})();
</script></body></html>
