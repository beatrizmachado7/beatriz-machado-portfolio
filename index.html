<!doctype html><html lang="pt-PT"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Beatriz Machado Studio</title><meta name="description" content="Beatriz Machado — Web Design & Brand Identity. Websites, landing pages, rebranding e identidade visual para marcas que querem uma presença profissional."><meta property="og:title" content="Beatriz Machado Studio — Web Design & Brand Identity"><meta property="og:description" content="Beatriz Machado — Web Design & Brand Identity. Websites, landing pages, rebranding e identidade visual para marcas que querem uma presença profissional."><meta property="og:type" content="website"><meta name="theme-color" content="#FDFCF9"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23FDFCF9'/%3E%3Crect x='6' y='6' width='52' height='52' fill='none' stroke='%23B8860B' stroke-width='2'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Arial' font-weight='700' font-size='20' fill='%23B8860B'%3EBM%3C/text%3E%3C/svg%3E"></head><body><link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,200..800&amp;family=Instrument+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style id="css">
/* Layout: editorial portfolio on off-white. Thin gold rules, large type, generous whitespace, square-cornered cards. */
:root{
  --paper:#FDFCF9; --paper-2:#F6F3ED; --white:#FFFFFF; --ink:#15130F; --muted:#6E675B; --line:#E7E1D6; --line-2:#D9D0C0;
  --gold:var(--user-gold,#B8860B); --gold-soft:#F5EEDF; --on-gold:#FFFFFF;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --wrap:1320px; --gutter:clamp(16px,4.5vw,64px); --r:3px;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased;margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
::selection{background:var(--gold);color:var(--on-gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gutter)}
.label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:500}
.eyebrow{display:flex;align-items:center;gap:14px}
.eyebrow::before{content:"";width:32px;height:1px;background:var(--gold)}
.display{font-family:var(--f-display);font-stretch:118%;font-weight:500;text-transform:uppercase;letter-spacing:-.025em;line-height:.94;text-wrap:balance;margin:0}
.display .thin{font-weight:250}
.gold{color:var(--gold)}
section{padding-block:clamp(88px,11vw,168px)}
.sec-head{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px 72px;align-items:end;margin-bottom:clamp(52px,6.5vw,96px)}
.sec-head > div{display:flex;flex-direction:column;gap:26px;container-type:inline-size;min-width:0}
.sec-head h2{font-size:clamp(2.3rem,10.5cqi,5.4rem)}
.sec-head h2 > span{display:block}
.sec-head .intro{max-width:40ch;color:var(--muted);font-size:1.05rem;margin:0}

/* buttons & links */
.btn{display:inline-flex;align-items:center;gap:14px;border-radius:var(--r);padding:17px 28px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;border:1px solid transparent;cursor:pointer;transition:background .35s,color .35s,border-color .35s,transform .35s var(--ease)}
.btn-gold{background:var(--gold);color:var(--on-gold)}
.btn-gold:hover{background:var(--ink)}
.btn-line{border-color:var(--ink)}
.btn-line:hover{background:var(--ink);color:var(--paper)}
.btn .arr{transition:transform .35s var(--ease)}
.btn:hover .arr{transform:translateX(5px)}
.tlink{display:inline-flex;align-items:center;gap:12px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;padding-bottom:7px;border-bottom:1px solid var(--gold);transition:gap .35s var(--ease),color .3s;cursor:pointer;background:none;border-top:0;border-left:0;border-right:0;padding-inline:0}
.tlink:hover{gap:20px;color:var(--gold)}
.tlink .arr{color:var(--gold)}

/* NAV */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:24px;height:76px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-stretch:125%;font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.mark{width:30px;height:30px;border:1px solid var(--gold);display:grid;place-items:center;font-size:10.5px;color:var(--gold);letter-spacing:.04em;font-weight:600}
.nav ul{display:flex;gap:36px;list-style:none;margin:0;padding:0}
.nav ul a{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);transition:color .25s;position:relative}
.nav ul a::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .4s var(--ease)}
.nav ul a:hover{color:var(--ink)}
.nav ul a:hover::after{transform:scaleX(1)}
.nav .btn{padding:12px 18px;font-size:11px}

/* HERO */
.hero{padding-block:clamp(40px,5vw,72px) clamp(72px,9vw,128px)}
.hero-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 32px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.hero-meta > span{display:inline-flex;align-items:center;gap:10px}
.dot{width:7px;height:7px;border-radius:50%;background:#3E9E6A;box-shadow:0 0 0 4px color-mix(in srgb,#3E9E6A 18%,transparent)}
.hero-title{container-type:inline-size;padding-block:clamp(44px,7vw,104px) clamp(36px,5vw,72px)}
.hero h1{font-size:9.2cqi;line-height:.92;letter-spacing:-.035em;font-stretch:122%}
.hero h1 > span{display:block}
.hero h1 .l1{font-weight:250}
.hero h1 .l2{font-weight:600;color:var(--gold)}
.hero-low{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:40px clamp(32px,7vw,120px);align-items:end;border-top:1px solid var(--line);padding-top:clamp(28px,3.5vw,44px)}
.hero .lead{font-size:clamp(1.1rem,1.5vw,1.3rem);line-height:1.55;max-width:40ch;margin:0}
.hero-right{display:flex;flex-direction:column;gap:28px;align-items:flex-start;min-width:0}
.svc-line{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:12px}

/* WORK */
.cases{display:flex;flex-direction:column;gap:clamp(96px,11vw,176px)}
.case{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:clamp(32px,5vw,88px);align-items:center;position:relative}
.case.flip .visual{order:2}
.case.flip{grid-template-columns:minmax(0,1fr) minmax(0,1.55fr)}
.visual{position:relative;min-width:0;display:block}
.shot{position:relative;overflow:hidden;aspect-ratio:16/10.4;max-width:100%;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 50px 90px -60px rgba(21,19,15,.5);transition:transform .9s var(--ease)}
.visual:hover .shot{transform:translateY(-8px)}
.shot img{position:absolute;left:0;top:32px;width:100%;height:calc(100% - 32px);object-fit:cover;object-position:top;display:block;transition:transform 1.2s var(--ease)}
.visual:hover .shot img{transform:scale(1.025)}
.chrome{position:absolute;left:0;right:0;top:0;height:32px;display:flex;align-items:center;gap:6px;padding:0 14px;z-index:2;background:#1B1915;color:#fff;border-bottom:1px solid #2A2620}
.chrome i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.4}
.chrome em{margin-left:12px;font:11px var(--f-mono);font-style:normal;opacity:.55;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.case-num{display:block;font-family:var(--f-mono);font-size:12px;color:var(--gold);letter-spacing:.12em;margin-bottom:16px}
.info{display:flex;flex-direction:column;gap:24px;min-width:0;container-type:inline-size}
.info h3{font-family:var(--f-display);font-stretch:120%;font-weight:500;text-transform:uppercase;letter-spacing:-.03em;line-height:.9;font-size:clamp(2.2rem,15cqi,4.8rem);margin:0;word-break:break-word}
.info p{margin:0;color:var(--muted);max-width:42ch}
.spec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-block:1px solid var(--line)}
.spec div{padding:16px 12px 16px 0;display:flex;flex-direction:column;gap:5px;min-width:0}
.spec div+div{padding-left:16px;border-left:1px solid var(--line)}
.spec small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
.spec span{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.art{position:absolute;inset:0;overflow:hidden;background:var(--ink);color:#F3EEE5}
.art-pad{position:absolute;inset:32px 0 0 0;padding:clamp(18px,5%,52px);display:flex;flex-direction:column;justify-content:flex-end;gap:12px}
.art b{font-family:var(--f-display);font-stretch:122%;font-weight:600;text-transform:uppercase;font-size:clamp(2rem,9cqi,5.4rem);line-height:.88;letter-spacing:-.03em}
.art small{font:11px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.shot.cq{container-type:inline-size}

/* SERVICES & INVESTMENT */
.inv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
.card{position:relative;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:clamp(30px,3.6vw,52px);display:flex;flex-direction:column;gap:26px;min-width:0;transition:border-color .6s var(--ease),transform .6s var(--ease),box-shadow .6s var(--ease)}
.card::before{content:"";position:absolute;left:-1px;top:-1px;height:1px;width:64px;background:var(--gold);transition:width .8s var(--ease)}
.card:hover{border-color:color-mix(in srgb,var(--gold) 40%,var(--line));transform:translateY(-4px);box-shadow:0 40px 70px -55px rgba(21,19,15,.4)}
.card:hover::before{width:calc(100% + 2px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.card .n{font-family:var(--f-mono);font-size:12px;color:var(--gold);letter-spacing:.1em}
.card h3{font-family:var(--f-display);font-stretch:120%;font-weight:500;text-transform:uppercase;font-size:clamp(1.6rem,2.6vw,2.3rem);line-height:1;letter-spacing:-.02em;margin:10px 0 0}
.price{display:flex;flex-direction:column;align-items:flex-end;gap:2px;text-align:right}
.price small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.price strong{font-family:var(--f-display);font-stretch:112%;font-weight:300;font-size:clamp(2rem,3.4vw,2.9rem);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.card p{margin:0;color:var(--muted);max-width:52ch}
.incl{display:flex;flex-direction:column;gap:6px}
.incl > small{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.incl ul{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px}
.incl li{display:flex;align-items:baseline;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:14px;min-width:0}
.incl li::before{content:"";width:9px;height:1px;background:var(--gold);flex:none;transform:translateY(-4px)}
.card .tlink{margin-top:auto;align-self:flex-start}
.notes{margin-top:40px;display:flex;flex-direction:column;gap:8px;padding-left:20px;border-left:1px solid var(--gold);max-width:72ch}
.notes p{margin:0;font-size:14px;color:var(--muted)}

/* ABOUT */
.about .wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(36px,8vw,140px);align-items:center}
.portrait{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);max-width:100%}
.portrait img{width:100%;height:100%;object-fit:cover;display:block}
.portrait .ph{position:absolute;inset:0;display:grid;place-items:center}
.portrait .ph::before{content:"";width:50%;aspect-ratio:1;border-radius:50%;border:1px solid var(--gold)}
.portrait .ph::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.portrait .cap{position:absolute;left:22px;bottom:20px}
.about-copy{display:flex;flex-direction:column;gap:28px;min-width:0;container-type:inline-size}
.about-copy h2{font-size:clamp(2.3rem,11cqi,5rem)}
.about-copy .big{font-family:var(--f-display);font-stretch:108%;font-weight:300;font-size:clamp(1.3rem,2vw,1.75rem);line-height:1.35;letter-spacing:-.01em;margin:0;max-width:34ch}
.about-copy p{margin:0;color:var(--muted);max-width:52ch}
.about-copy p.big{color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:10px 44px;border-top:1px solid var(--line);padding-top:22px}
.facts span{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}

/* PROCESS */
.process{background:var(--paper-2);border-block:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
.step{position:relative;padding-top:34px;min-width:0}
.step::before{content:"";position:absolute;top:0;left:0;right:-28px;height:1px;background:var(--line-2)}
.step:last-child::before{right:0}
.step::after{content:"";position:absolute;top:-4px;left:0;width:9px;height:9px;border-radius:50%;background:var(--paper-2);border:1px solid var(--gold);transition:background .4s}
.step:hover::after{background:var(--gold)}
.step .n{font-family:var(--f-display);font-stretch:125%;font-weight:200;font-size:clamp(2.6rem,4vw,3.8rem);line-height:1;color:var(--gold);display:block;margin-bottom:26px;letter-spacing:-.03em}
.step h3{font-family:var(--f-display);font-stretch:118%;font-weight:500;text-transform:uppercase;font-size:1.15rem;letter-spacing:.02em;margin:0 0 10px}
.step p{margin:0;color:var(--muted);font-size:15px;max-width:30ch}

/* EXTRAS + MAINTENANCE */
.extras .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:clamp(36px,6vw,104px);align-items:start}
.extras-l{display:flex;flex-direction:column;gap:26px;min-width:0;container-type:inline-size}
.extras-l h2{font-size:clamp(2rem,8.5cqi,3.8rem)}
.extras-l .intro{color:var(--muted);margin:0;max-width:44ch}
.acc{border-top:1px solid var(--ink);border-bottom:1px solid var(--line)}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 0;cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
.acc summary::-webkit-details-marker{display:none}
.acc summary .plus{position:relative;width:14px;height:14px;flex:none}
.acc summary .plus::before,.acc summary .plus::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--gold);transition:transform .4s var(--ease)}
.acc summary .plus::after{transform:rotate(90deg)}
.acc[open] summary .plus::after{transform:rotate(0)}
.acc ul{list-style:none;margin:0;padding:0 0 8px}
.acc li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:baseline;padding:14px 0;border-top:1px solid var(--line);font-size:15px}
.acc li span:last-child{font-family:var(--f-mono);font-size:12.5px;color:var(--gold);text-align:right;white-space:nowrap}
.maint{position:relative;background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:clamp(28px,3.4vw,44px);display:flex;flex-direction:column;gap:20px;min-width:0}
.maint::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:1px;background:var(--gold)}
.maint .tag{align-self:flex-start;border:1px solid var(--gold);color:var(--gold);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;padding:5px 10px;border-radius:var(--r)}
.maint h3{font-family:var(--f-display);font-stretch:120%;font-weight:500;text-transform:uppercase;font-size:clamp(1.4rem,2.2vw,1.8rem);line-height:1;margin:0}
.maint .price{align-items:flex-start;text-align:left}
.maint ul{list-style:none;margin:0;padding:0}
.maint li{display:flex;align-items:baseline;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.maint li::before{content:"";width:9px;height:1px;background:var(--gold);flex:none;transform:translateY(-4px)}
.maint .note{font-size:13.5px;color:var(--muted);margin:0}

/* PROPOSAL FORM */
.proposal{border-top:1px solid var(--line)}
.proposal .wrap{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(36px,7vw,120px);align-items:start}
.prop-l{display:flex;flex-direction:column;gap:26px;min-width:0;container-type:inline-size;position:sticky;top:120px}
.prop-l h2{font-size:clamp(2.1rem,10cqi,4.6rem)}
.prop-l .intro{color:var(--muted);margin:0;max-width:40ch;font-size:1.05rem}
.wa{align-self:flex-start;display:inline-flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line-2);padding-bottom:4px;transition:color .3s,border-color .3s}
.wa:hover{color:#1C8A55;border-color:#25A366}
.wa svg,.btn svg{width:17px;height:17px;flex:none}
.qform{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:clamp(24px,4vw,52px);display:flex;flex-direction:column;gap:30px;min-width:0;position:relative}
.qform::before{content:"";position:absolute;left:-1px;top:-1px;width:64px;height:1px;background:var(--gold)}
.qform fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.qform legend,.field label{font-size:14.5px;font-weight:500;color:var(--ink);padding:0;margin-bottom:4px}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.field{display:flex;flex-direction:column;gap:8px;min-width:0}
.field input,.field textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r);padding:14px 15px;width:100%;transition:border-color .25s,box-shadow .25s}
.field textarea{min-height:130px;resize:vertical}
.field input::placeholder,.field textarea::placeholder{color:#A49C8D}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 15%,transparent)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opts.chips{display:flex;flex-wrap:wrap}
.opt{position:relative;display:block;min-width:0}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;z-index:1}
.opt span{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--paper);font-size:14px;cursor:pointer;transition:border-color .25s,background .25s;min-height:100%}
.opt span::before{content:"";width:14px;height:14px;border:1px solid var(--line-2);background:#fff;flex:none;transition:all .25s}
.opt.radio span::before{border-radius:50%}
.opt input:hover + span{border-color:var(--gold)}
.opt input:checked + span{border-color:var(--gold);background:var(--gold-soft)}
.opt input:checked + span::before{border-color:var(--gold);box-shadow:inset 0 0 0 3px #fff;background:var(--gold)}
.opt input:focus-visible + span{outline:2px solid var(--gold);outline-offset:2px}
.err,.qerr{color:#B42318;font-size:13px}
.qsubmit{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
.qsubmit .btn{border:0}
.qok{gap:20px}
.qok .tick{width:48px;height:48px;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:20px;border-radius:50%}
.qok h3{font-family:var(--f-display);font-stretch:118%;font-weight:500;text-transform:uppercase;font-size:clamp(1.5rem,2.8vw,2.2rem);line-height:1.05;margin:0;letter-spacing:-.02em}
.qok p{margin:0;color:var(--muted);max-width:48ch}
.qok dl{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin:0;font-size:14px;border-block:1px solid var(--line);padding-block:16px}
.qok dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.qok dd{margin:0}
.qok-actions{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
.hp{position:absolute!important;left:-9999px!important;width:1px;height:1px;overflow:hidden}

/* FINAL CTA + FOOTER */
.cta{background:var(--paper-2);border-top:1px solid var(--line);text-align:left}
.cta .wrap{container-type:inline-size;display:flex;flex-direction:column;gap:30px}
.cta h2{font-size:clamp(2.6rem,10.5cqi,8.6rem);margin:0}
.cta h2 > span{display:block}
.cta-low{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:28px 48px;border-top:1px solid var(--line-2);padding-top:30px}
.cta-low p{margin:0;font-size:clamp(1.05rem,1.5vw,1.3rem);max-width:38ch}
.foot{border-top:1px solid var(--line);padding-block:clamp(48px,6vw,80px) 36px;background:var(--paper)}
.foot .wrap{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:36px 48px}
.foot h4{margin:0 0 14px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
.foot .fbrand{font-family:var(--f-display);font-stretch:125%;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.foot .fpos{display:block;margin-top:8px;color:var(--gold);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.mail a{font-size:16px;border-bottom:1px solid var(--line-2);padding-bottom:2px;word-break:break-all;transition:border-color .3s,color .3s}
.mail a:hover{color:var(--gold);border-color:var(--gold)}
.copy{border:1px solid var(--line-2);background:transparent;border-radius:var(--r);padding:6px 12px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;transition:border-color .3s,color .3s}
.copy:hover{border-color:var(--gold);color:var(--gold)}
.socials{display:flex;flex-direction:column;gap:8px}
.socials a{font-size:14px;display:inline-flex;gap:8px;transition:color .3s}
.socials a:hover{color:var(--gold)}
.foot-bottom{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:24px;margin-top:20px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* motion */
@media (prefers-reduced-motion:no-preference){
  .hero h1 > span{animation:rise 1.1s var(--ease) both}
  .hero h1 > span.l2{animation-delay:.12s}
  .hero-low{animation:fade 1.2s .35s var(--ease) both}
  @keyframes rise{from{transform:translateY(28px);opacity:.001}}
  @keyframes fade{from{opacity:.001}}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* responsive */
@media (max-width:1060px){
  .nav ul{display:none}
  .hero-low,.sec-head,.about .wrap,.extras .wrap,.proposal .wrap{grid-template-columns:minmax(0,1fr)}
  .case,.case.flip{grid-template-columns:minmax(0,1fr)}
  .case.flip .visual{order:0}
  .inv{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:48px}
  .step::before{right:0}
  .prop-l{position:static}
  .foot .wrap{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .foot .wrap > :first-child{grid-column:1/-1}
}
@media (max-width:640px){
  .steps,.qgrid,.opts,.incl ul{grid-template-columns:minmax(0,1fr)}
  .spec{grid-template-columns:minmax(0,1fr)}
  .spec div+div{padding-left:0;border-left:0;border-top:1px solid var(--line)}
  .hero-meta .hide-sm{display:none}
  .chrome em{display:none}
  .card-top{flex-direction:column}
  .price{align-items:flex-start;text-align:left}
  .foot .wrap{grid-template-columns:minmax(0,1fr)}
  .nav .btn{padding:11px 14px;white-space:nowrap}
  .brand [data-k="nav.name"]{font-size:11.5px;letter-spacing:.06em}
}

/* ---- images ---- */
function pickImage(path){
  var inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];if(!f)return;var rd=new FileReader();
    rd.onload=function(){var img=new Image();
      img.onload=function(){var max=1800,sc=Math.min(1,max/Math.max(img.width,img.height));var cv=document.createElement("canvas");cv.width=Math.round(img.width*sc);cv.height=Math.round(img.height*sc);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);var url=cv.toDataURL("image/webp",0.82);if(url.indexOf("data:image/webp")!==0)url=cv.toDataURL("image/jpeg",0.84);set(path,url);markDirty();render();};
      img.onerror=function(){toast("Não foi possível ler esta imagem. Experimenta um JPG ou PNG.");};img.src=rd.result;};
    rd.readAsDataURL(f);};
  inp.click();
}

function buildBody(){

function resetCss(){var st=[].slice.call(document.head.querySelectorAll("style")).filter(function(s){return /safe-area-inset/.test(s.textContent);})[0];
  return st?st.textContent:":root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif;background:#fff}img{max-width:100%}[hidden]{display:none!important}";}
function buildDoc(){return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+resetCss()+"</style></head><body>"+buildBody()+"</body></html>";}
function exportFile(){var html=buildDoc(),name="beatriz-machado-portfolio.html";
  if(downloadsNs){downloadsNs.save({filename:name,data:html}).then(function(){toast("Ficheiro pronto a guardar");},function(){toast("A exportação foi cancelada.");});return;}
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));a.download=name;document.body.appendChild(a);a.click();a.remove();}catch(e){toast("Não foi possível exportar neste ambiente.");}}
function save(){
  if(!artifactNs){toast("Guardar não está disponível aqui. Usa Exportar HTML.");return;}
  var b=document.querySelector('[data-act="save"]');if(b){b.textContent="A guardar…";b.disabled=true;}
  artifactNs.publish(buildDoc()).then(function(){dirty=false;toast("Guardado. A página vai atualizar.");},function(err){var c=err&&err.code;
    if(c==="conflict"){toast("Existe uma versão mais recente. A página vai recarregar.");return;}
    if(c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="consent_required"||c==="capability_disabled"){canWrite=false;toast("Não tens permissão para guardar. Usa Exportar HTML.");}
    else if(c==="too_large")toast("O site ficou demasiado pesado. Usa imagens mais pequenas.");
    else if(c==="rate_limited")toast("Muitas gravações seguidas. Espera um pouco e tenta de novo.");
    else toast("Não foi possível guardar. Tenta outra vez.");renderBar();});
}

  if(el.type==="checkbox")qDraft[el.name]=[].filter.call(f.querySelectorAll('input[name="'+el.name+'"]'),function(x){return x.checked;}).map(function(x){return x.value;});else qDraft[el.name]=el.value;clearErr(el.name);},true);
document.addEventListener("submit",function(e){
  var f=e.target;if(f.id!=="qform")return;e.preventDefault();
  if(editing){toast("Sai do modo de edição para testar o formulário.");return;}
  var r=readForm(f),ok=true,errEl=document.getElementById("q-err");
  ["nome","email","servico","mensagem"].forEach(function(k){var x=document.getElementById("e-"+k);if(x)x.textContent="";});errEl.textContent="";
  if(!r.nome){document.getElementById("e-nome").textContent="Escreve o teu nome.";ok=false;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email||"")){document.getElementById("e-email").textContent="Escreve um email válido, por exemplo nome@email.com.";ok=false;}
  if(!r.servico){document.getElementById("e-servico").textContent="Escolhe o serviço que procuras.";ok=false;}
    if(!ok){errEl.textContent="Falta preencher alguns campos.";return;}

  var btn=document.getElementById("q-send");btn.disabled=true;var lbl=btn.querySelector("[data-k]");if(lbl)lbl.textContent="A enviar…";
  var body=new URLSearchParams(Object.assign({"form-name":"proposta"},r)).toString();
  fetch("/",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body}).then(function(res){
    if(!res.ok)throw new Error(res.status);quoteSent=r;qDraft={};render();var q=document.getElementById("proposta");if(q)q.scrollIntoView({behavior:"smooth",block:"start"});
  }).catch(function(){btn.disabled=false;if(lbl)lbl.textContent=S.proposal.submit;
    errEl.innerHTML='Não foi possível enviar o pedido por aqui. <a href="'+waLink(waSummary(r))+'" target="_blank" rel="noopener" style="text-decoration:underline;font-weight:600">Envia-o pelo WhatsApp</a>.';});
});

/* ---- generic events ---- */
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.id==="accent"){S.meta.accent=el.value;applyAccent();markDirty();return;}
  if(el.dataset&&el.dataset.url){set(el.dataset.url,el.value.trim());markDirty();return;}
  var k=el.closest&&el.closest("[data-k]");
  if(k&&editing){set(k.dataset.k,k.innerText.replace(/\s+\n/g,"\n").trim());markDirty();}
});
document.addEventListener("focusout",function(e){var k=e.target.closest&&e.target.closest("[data-k]");if(k&&editing&&/^services\.(items\.\d+\.(name|price)|from)$/.test(k.dataset.k))setTimeout(render,0);});
document.addEventListener("change",function(e){var el=e.target;
  if(el.dataset&&el.dataset.sec){S.hidden=S.hidden||{};S.hidden[el.dataset.sec]=!el.checked;markDirty();render();}
  if(el.dataset&&el.dataset.url)render();});
document.addEventListener("paste",function(e){var k=e.target.closest&&e.target.closest("[data-k]");if(!k||!editing)return;e.preventDefault();var txt=(e.clipboardData||window.clipboardData).getData("text/plain");if(!document.execCommand("insertText",false,txt))k.innerText+=txt;});
document.addEventListener("keydown",function(e){var k=e.target.closest&&e.target.closest("[data-k]");if(k&&editing&&e.key==="Enter"&&!/^(P)$/.test(k.tagName)){e.preventDefault();k.blur();}
  if(k&&editing&&e.key===" "&&k.closest("summary"))e.stopPropagation();});
function goForm(){var q=document.getElementById("proposta");if(q)q.scrollIntoView({behavior:"smooth",block:"start"});}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");
  if(editing&&!b){var a=e.target.closest("a[href]");if(a&&(e.target.closest("[data-k]")||!/^#/.test(a.getAttribute("href"))))e.preventDefault();
    if(e.target.closest("summary [data-k]"))e.preventDefault();return;}
  if(!b)return;
  var act=b.dataset.act,path=b.dataset.path,i=+b.dataset.i;
  if(act==="copy"){e.preventDefault();var em=S.footer.email;var done=function(){b.textContent="Copiado";setTimeout(function(){b.textContent="Copiar";},1600);};
    try{navigator.clipboard.writeText(em).then(done,selectEmail);}catch(err){selectEmail();}return;}
  e.preventDefault();
  if(act==="propose"){if(editing)return;quoteSent=null;qDraft.servico=serviceOptions()[+b.dataset.svc];render();goForm();return;}
  if(act==="propose-maint"){if(editing)return;quoteSent=null;var mx=S.proposal.extras.filter(function(x){return /manuten/i.test(x);})[0];qDraft.extras=(qDraft.extras||[]).filter(function(x){return x!==mx;});if(mx)qDraft.extras.push(mx);render();goForm();return;}
  if(act==="newquote"){quoteSent=null;render();return;}
  if(act==="edit"){editing=true;document.body.classList.add("editing");render();toast("Clica em qualquer texto para o editar");return;}
  if(act==="exit"){editing=false;document.body.classList.remove("editing");var sp=document.getElementById("secpanel");if(sp)sp.remove();render();return;}
  if(act==="save"){save();return;}
  if(act==="export"){exportFile();return;}
  if(act==="sections"){toggleSections();return;}
  if(act==="resetcolor"){S.meta.accent="";applyAccent();markDirty();renderBar();return;}
  if(act==="img"){pickImage(path);return;}
  if(act==="noimg"){set(path,"");markDirty();render();return;}
  var arr=get(path);if(!arr)return;
  if(act==="add"){var tp=TPL[b.dataset.tpl];arr.push(typeof tp==="object"?JSON.parse(JSON.stringify(tp)):tp);}
  else if(act==="pop")arr.pop();
  else if(act==="del")arr.splice(i,1);
  else if(act==="up"&&i>0){var x=arr[i];arr[i]=arr[i-1];arr[i-1]=x;}
  else if(act==="down"&&i<arr.length-1){var y=arr[i];arr[i]=arr[i+1];arr[i+1]=y;}
  markDirty();render();
});
function selectEmail(){var a=document.querySelector('[data-k="footer.email"]');if(!a)return;var r=document.createRange();r.selectNodeContents(a);var s=getSelection();s.removeAllRanges();s.addRange(r);}
window.addEventListener("beforeunload",function(e){if(dirty&&editing){e.preventDefault();e.returnValue="";}});

/* ---- boot ---- */
applyAccent();render();
if(window.claude&&typeof window.claude.use==="function"){
  window.claude.use("user").then(function(u){var can=false;try{can=!!(u&&(u.canEdit()||u.isOwner()));}catch(e){}if(can){canWrite=true;renderBar();}},function(){});
  window.claude.use("artifact").then(function(ns){artifactNs=ns;if(ns&&canWrite===false&&location.hash==="#editar")canWrite=null;renderBar();},function(){});
  window.claude.use("downloads").then(function(ns){downloadsNs=ns;},function(){});
}
})();
</script></body></html>
