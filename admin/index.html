<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Painel — Beatriz Machado Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23FDFCF9'/%3E%3Crect x='6' y='6' width='52' height='52' fill='none' stroke='%23B8860B' stroke-width='2'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Arial' font-weight='700' font-size='20' fill='%23B8860B'%3EBM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,200..800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Admin: same identity as the site — off-white, gold accents, ink text, thin rules, square-ish corners */
:root{
  --paper:#FDFCF9; --paper-2:#F6F3ED; --white:#FFFFFF; --ink:#15130F; --muted:#6E675B; --line:#E7E1D6; --line-2:#D9D0C0;
  --gold:#B8860B; --gold-soft:#F5EEDF;
  --ok:#2F7D53; --ok-soft:#E6F2EA; --warn:#9A6A00; --warn-soft:#FBF1D9; --bad:#B42318; --bad-soft:#FBE9E7; --info:#2C5C8A; --info-soft:#E7EFF7;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"Instrument Sans","Helvetica Neue",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:3px; --ease:cubic-bezier(.2,.7,.2,1); color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1320px;margin-inline:auto;padding-inline:clamp(16px,3.5vw,48px)}
.label{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:500}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:var(--r);padding:11px 18px;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;border:1px solid transparent;cursor:pointer;background:none;transition:background .25s,color .25s,border-color .25s;white-space:nowrap}
.btn-gold{background:var(--gold);color:#fff}.btn-gold:hover{background:var(--ink)}
.btn-line{border-color:var(--line-2)}.btn-line:hover{border-color:var(--gold);color:var(--gold)}
.btn-danger{border-color:#E7B4AE;color:var(--bad)}.btn-danger:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn-sm{padding:7px 11px;font-size:10.5px}
.input,select.input,textarea.input{width:100%;background:var(--white);border:1px solid var(--line-2);border-radius:var(--r);padding:10px 12px;font-size:14px;transition:border-color .2s,box-shadow .2s}
.input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 15%,transparent)}
textarea.input{min-height:96px;resize:vertical}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:min(420px,100%);background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:clamp(28px,5vw,44px);display:flex;flex-direction:column;gap:18px;position:relative}
.login-card::before{content:"";position:absolute;left:-1px;top:-1px;width:64px;height:1px;background:var(--gold)}
.login-card h1{font-family:var(--f-display);font-stretch:120%;font-weight:500;text-transform:uppercase;font-size:2rem;letter-spacing:-.02em;margin:0;line-height:1}
.login-card p{margin:0;color:var(--muted);font-size:14px}
.err{color:var(--bad);font-size:13px;min-height:1em}
.linkbtn{background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line-2);align-self:flex-start}
.linkbtn:hover{color:var(--gold);border-color:var(--gold)}
.mark{width:32px;height:32px;border:1px solid var(--gold);display:grid;place-items:center;font-size:11px;color:var(--gold);font-weight:600;letter-spacing:.04em;flex:none}

/* top */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:20px;height:68px}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-stretch:125%;font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.brand small{font-family:var(--f-mono);font-weight:500;color:var(--gold);letter-spacing:.16em;font-size:10.5px}
.tabs{display:flex;gap:4px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:10px 14px;font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);cursor:pointer;position:relative;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tabs button::after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:1px;background:var(--gold);transform:scaleX(0);transition:transform .35s var(--ease)}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink)}.tabs button.on::after{transform:scaleX(1)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:#fff;font-family:var(--f-mono);font-size:10px;display:inline-grid;place-items:center;letter-spacing:0}
.top-actions{display:flex;gap:8px}
.demo-bar{background:var(--gold-soft);border-bottom:1px solid color-mix(in srgb,var(--gold) 35%,var(--line));font-size:13px}
.demo-bar .wrap{padding-block:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}

main{padding-block:clamp(28px,4vw,56px) 80px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;margin-bottom:28px}
.head h2{font-family:var(--f-display);font-stretch:120%;font-weight:500;text-transform:uppercase;font-size:clamp(1.8rem,3.4vw,2.8rem);letter-spacing:-.025em;line-height:1;margin:6px 0 0}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools .search{width:260px;flex:0 1 260px;max-width:100%}
@media (max-width:720px){.tools{width:100%}.tools .search{flex:1 1 auto;width:auto}}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:28px}
.kpi{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:10px;position:relative;min-width:0}
.kpi::before{content:"";position:absolute;left:-1px;top:-1px;width:40px;height:1px;background:var(--gold)}
.kpi strong{font-family:var(--f-display);font-stretch:112%;font-weight:400;font-size:clamp(1.7rem,2.6vw,2.3rem);line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span.s{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
.panel{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.panel h3{margin:0 0 14px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;display:flex;justify-content:space-between;gap:12px}
.panel h3 button{font-family:var(--f-body);letter-spacing:.06em}
.mini{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.mini:hover .t{color:var(--gold)}
.mini .t{font-weight:500;transition:color .2s}
.mini .m{font-size:12.5px;color:var(--muted)}
.empty{padding:28px 0;text-align:left;color:var(--muted);font-size:14px}
.pipe{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;margin-top:6px}
.pipe div{padding:14px 12px;background:var(--paper-2);display:flex;flex-direction:column;gap:4px}
.pipe div b{font-family:var(--f-display);font-weight:400;font-size:1.5rem;line-height:1}


/* monthly billing */
.bill{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;margin-bottom:20px;align-items:stretch}
.bill .lft{display:flex;flex-direction:column;gap:12px}
.bill .big{font-family:var(--f-display);font-stretch:112%;font-weight:400;font-size:clamp(2.2rem,4vw,3.2rem);line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.bill .delta{font-size:13px;color:var(--muted)}
.bill .delta b{font-weight:600;color:var(--ink)}
.bill .split{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:auto}
.bill .split div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.bill .split span:last-child{font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;height:100%;min-height:200px;padding-top:26px;border-bottom:1px solid var(--line-2);position:relative}
.bar{position:relative;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;height:100%;outline:none;cursor:default}
.bar i{display:block;background:color-mix(in srgb,var(--gold) 55%,#fff);border-radius:4px 4px 0 0;min-height:2px;transition:background .25s}
.bar.cur i{background:var(--gold)}
.bar:hover i,.bar:focus-visible i{background:color-mix(in srgb,var(--gold) 75%,#fff)}
.bar.cur:hover i{background:var(--gold)}
.bar .v{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--h) + 6px);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink);font-weight:500}
.bar .tip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--h) + 8px);background:var(--ink);color:#fff;font-size:12px;padding:6px 9px;border-radius:var(--r);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:2}
.bar:hover .tip,.bar:focus-visible .tip{opacity:1}
.bar .tip{white-space:normal;width:max-content;max-width:200px}
.bar:nth-child(-n+2) .tip{left:0;transform:none}
.bar:nth-child(n+4) .tip{left:auto;right:0;transform:none}
.bar:hover .v,.bar:focus-visible .v{opacity:0}
.mlabels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:8px}
.mlabels span{text-align:center;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mlabels span.cur{color:var(--ink)}
@media (max-width:1000px){.bill{grid-template-columns:minmax(0,1fr)}}
/* status chips */
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;border:1px solid transparent}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-novo{background:var(--gold-soft);color:#8A6508;border-color:color-mix(in srgb,var(--gold) 30%,transparent)}
.s-analise{background:var(--info-soft);color:var(--info)}
.s-proposta{background:var(--warn-soft);color:var(--warn)}
.s-aceite{background:var(--ok-soft);color:var(--ok)}
.s-recusado{background:#F1EFEB;color:#6E675B}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{background:var(--white);border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.filters button.on{border-color:var(--gold);background:var(--gold-soft)}

/* rows (table-like, responsive) */
.rows{background:var(--white);border:1px solid var(--line);border-radius:var(--r)}
.row{display:grid;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);cursor:pointer;transition:background .2s}
.row:first-child{border-top:0}
.row:hover{background:var(--paper)}
.row.hd{cursor:default;background:var(--paper-2);padding-block:10px}
.row.hd:hover{background:var(--paper-2)}
.row .main{display:flex;flex-direction:column;min-width:0}
.row .main b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .main span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .c{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.row .r{text-align:right}
.row.new .main b::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:8px;vertical-align:middle}
.rows.leads .row{grid-template-columns:110px minmax(0,1.4fr) minmax(0,1.2fr) 130px 130px}
.rows.clients .row{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.2fr) 90px 120px}

/* kanban */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:16px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.col h4{margin:4px 4px 6px;display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.pcard{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .25s,transform .25s var(--ease)}
.pcard:hover{border-color:color-mix(in srgb,var(--gold) 45%,var(--line));transform:translateY(-2px)}
.pcard b{font-weight:500;line-height:1.3}
.pcard .m{font-size:12.5px;color:var(--muted)}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:8px;font-size:12.5px}
.pcard .due.late{color:var(--bad);font-weight:500}
.pcard .moves{display:flex;gap:4px}
.pcard .moves button{width:26px;height:26px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--white);cursor:pointer;font-size:13px;line-height:1}
.pcard .moves button:hover{border-color:var(--gold);color:var(--gold)}
.tag{font-family:var(--f-mono);font-size:10.5px;color:var(--gold);letter-spacing:.06em}


/* whatsapp reply */
.wa-box{display:flex;flex-direction:column;gap:12px;padding:20px;background:var(--white);border:1px solid var(--line);border-radius:var(--r);position:relative}
.wa-box::before{content:"";position:absolute;left:-1px;top:-1px;width:48px;height:1px;background:#25A366}
.wa-box h4{margin:0;display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:500}
.wa-box h4 svg{width:16px;height:16px;color:#1C8A55}
.tpls{display:flex;flex-wrap:wrap;gap:6px}
.tpls button{background:var(--paper);border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;font-size:12.5px;cursor:pointer}
.tpls button.on{border-color:#25A366;background:#E8F5EE;color:#1C6B45}
.wa-box textarea{min-height:170px;font-size:14px;line-height:1.5}
.btn-wa{background:#25A366;color:#fff}.btn-wa:hover{background:#1C8A55}
.btn-wa svg{width:16px;height:16px}
.wa-ask{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;background:#E8F5EE;border-radius:var(--r);font-size:13.5px;color:#1C6B45}
.hist{display:flex;flex-direction:column}
.hist div{padding:12px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.hist .hm{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
.hist .hm b{color:#1C6B45;font-weight:500}
.hist p{margin:0;font-size:13.5px;white-space:pre-wrap;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nophone{font-size:13.5px;color:var(--muted);margin:0}
/* drawer */
.ov{position:fixed;inset:0;z-index:50;background:rgba(21,19,15,.36);display:flex;justify-content:flex-end}
.drawer{width:min(560px,100%);height:100%;background:var(--paper);border-left:1px solid var(--gold);overflow-y:auto;padding:28px clamp(18px,4vw,36px) 48px;display:flex;flex-direction:column;gap:22px}
@media (prefers-reduced-motion:no-preference){.drawer{animation:din .45s var(--ease) both}@keyframes din{from{transform:translateX(30px);opacity:.001}}}
.dhead{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.dhead h3{margin:6px 0 0;font-family:var(--f-display);font-stretch:118%;font-weight:500;text-transform:uppercase;font-size:1.6rem;letter-spacing:-.02em;line-height:1.05;word-break:break-word}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px 16px;font-size:14px;border-block:1px solid var(--line);padding-block:16px;margin:0}
.kv dt{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.kv dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--bad)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r);font-size:13px;box-shadow:0 14px 30px -12px rgba(0,0,0,.4)}

@media (max-width:1000px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:minmax(0,1fr)}
  .top .wrap{flex-wrap:wrap;height:auto;padding-block:12px;gap:10px}
  .tabs{order:3;width:100%;margin-left:-14px}
  .top-actions{margin-left:auto}
}
@media (max-width:720px){
  .rows .row.hd{display:none}
  .rows.leads .row,.rows.clients .row{grid-template-columns:minmax(0,1fr) auto;gap:6px 12px}
  .rows .row .c.opt{display:none}
  .form{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:minmax(0,1fr);gap:2px}
  .kv dd{margin-bottom:10px}
  .pipe{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* notifications */
.bell{position:relative;width:38px;height:38px;display:grid;place-items:center;border:1px solid var(--line-2);border-radius:var(--r);background:transparent;cursor:pointer;color:var(--ink)}
.bell:hover,.bell.on{border-color:var(--gold);color:var(--gold)}
.bell svg{width:18px;height:18px}
.bell .badge{position:absolute;top:-7px;right:-7px}
.bell.ring svg{animation:ring .9s var(--ease)}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(14deg)}40%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}80%{transform:rotate(-4deg)}}
.npop{position:fixed;top:76px;right:max(16px,calc((100vw - 1280px)/2 + 16px));width:min(380px,calc(100vw - 32px));background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 30px 60px -30px rgba(21,19,15,.45);z-index:40;display:flex;flex-direction:column;max-height:min(560px,calc(100vh - 90px))}
.npop::before{content:"";position:absolute;left:-1px;top:-1px;width:48px;height:1px;background:var(--gold)}
.npop-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.npop-h b{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.nlist{overflow-y:auto;flex:1}
.nitem{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:start;padding:13px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;font:inherit;color:inherit}
.nitem:hover{background:var(--paper)}
.nitem .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);color:var(--muted);font-size:13px}
.nitem.unread .ic{background:var(--gold);color:#fff}
.nitem .tt{display:flex;flex-direction:column;gap:2px;min-width:0}
.nitem .tt b{font-weight:600;font-size:13.5px}
.nitem .tt span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.nitem time{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);white-space:nowrap;padding-top:3px}

<div id="app"></div>
<script>
(function(){
"use strict";
/* ---------- constants ---------- */
var LEAD_STATUS=[["novo","Novo"],["analise","Em análise"],["proposta","Proposta enviada"],["aceite","Aceite"],["recusado","Recusado"]];
var STAGES=[["iniciar","A iniciar"],["curso","Em curso"],["revisao","Em revisão"],["entregue","Entregue"]];

var st={key:"",demo:false,tab:"resumo",data:{leads:[],clients:[],projects:[],users:[],notifs:[],testimonials:[],invites:[]},drawer:null,leadFilter:"todos",q:"",loading:false,confirm:null,lastSeen:0,bell:false,status:null,known:null};

try{st.key=sessionStorage.getItem("bm-admin-key")||"";}catch(e){}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function fmt(n){return (Math.round(n||0)).toLocaleString("pt-PT")+"€";}
function d(iso,withTime){if(!iso)return "—";var x=new Date(iso);if(isNaN(x))return esc(iso);var o={day:"2-digit",month:"short"};if(x.getFullYear()!==new Date().getFullYear())o.year="numeric";var s=x.toLocaleDateString("pt-PT",o);if(withTime)s+=", "+x.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});return s;}
function parseTotal(t){t=String(t||"");var mo=0,once=0,m=t.match(/(\d[\d.\s]*)\s*€\s*\/\s*m[eê]s/i);if(m)mo=+m[1].replace(/[^\d]/g,"");var o=t.replace(/(\d[\d.\s]*)\s*€\s*\/\s*m[eê]s/ig,"").match(/(\d[\d.\s]*)\s*€/);if(o)once=+o[1].replace(/[^\d]/g,"");return {once:once,monthly:mo};}
function label(list,k){for(var i=0;i<list.length;i++)if(list[i][0]===k)return list[i][1];return k;}
function chip(k){return '<span class="chip s-'+esc(k)+'">'+esc(label(LEAD_STATUS,k))+'</span>';}
function byId(col,id){return st.data[col].filter(function(x){return x.id===id;})[0];}

function uid(){return (crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2));}

/* ---------- API ---------- */
function api(method,qs,body){
  if(st.demo)return Promise.resolve(demoApi(method,qs,body));
  return fetch("/api/admin"+(qs||""),{method:method,headers:{"x-admin-key":st.key,"content-type":"application/json"},body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok){var e=new Error(j.error||("Erro "+r.status));e.status=r.status;throw e;}return j;});});
}
function load(silent){
  st.loading=!silent;if(!silent)render();
  return api("GET").then(function(j){
    var N=j.notifs||[],fresh=st.known?N.filter(function(n){return !n.read&&st.known.indexOf(n.id)<0;}):[];
    st.known=N.map(function(n){return n.id;});
    st.data={leads:j.leads||[],clients:j.clients||[],projects:j.projects||[],users:j.users||[],notifs:N,testimonials:j.testimonials||[],invites:j.invites||[]};st.loading=false;
    if(silent&&st.drawer)renderTop();else render();
    if(fresh.length)alertNew(fresh);
    setTitle();if(!silent||!st.status||!st.status.admin)checkStatus();
  }).catch(function(e){st.loading=false;
    if(silent&&e.status!==401){return;}
    st.key="";try{sessionStorage.removeItem("bm-admin-key");}catch(x){}
    st.loginErr=e.status===401?"Palavra-passe incorreta.":e.message;checkStatus();render();});
}
function checkStatus(){if(st.demo)return;fetch("/api/status").then(function(r){return r.json();}).then(function(j){st.status=j;render();},function(){st.status={offline:true};render();});}
function unread(){return st.data.notifs.filter(function(n){return !n.read;});}
function setTitle(){var n=unread().length;document.title=(n?"("+n+") ":"")+"Painel — Beatriz Machado Studio";}
function ago(iso){var s=(Date.now()-new Date(iso))/1e3;if(s<60)return "agora";if(s<3600)return Math.floor(s/60)+" min";if(s<86400)return Math.floor(s/3600)+" h";if(s<7*86400)return Math.floor(s/86400)+" d";return d(iso);}
var audioCtx=null;
function chime(){if(!sound)return;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();var t=audioCtx.currentTime;[[880,0],[1318.5,.14]].forEach(function(p){var o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="sine";o.frequency.value=p[0];g.gain.setValueAtTime(0,t+p[1]);g.gain.linearRampToValueAtTime(.18,t+p[1]+.02);g.gain.exponentialRampToValueAtTime(.001,t+p[1]+.6);o.connect(g);g.connect(audioCtx.destination);o.start(t+p[1]);o.stop(t+p[1]+.65);});}catch(e){}}

      nt.onclick=function(){window.focus();openNotif(x.id);nt.close();};});}}catch(e){}

function markRead(ids){var L=st.data.notifs,ch=false;L.forEach(function(n){if(!n.read&&(!ids||ids.indexOf(n.id)>-1)){n.read=true;ch=true;}});if(!ch)return;setTitle();

  if(n.leadId&&byId("leads",n.leadId)){st.tab="pedidos";openDrawer("lead",n.leadId);}else if(n.type==="testimonial"){st.tab="testemunhos";st.drawer=null;render();}else if(n.type==="account"){st.tab="clientes";st.drawer=null;render();var u=document.getElementById("contas");if(u)u.scrollIntoView({block:"start"});}else render();}

function renderTop(){var t=document.querySelector("header.top");if(!t){render();return;}var w=document.createElement("div");w.innerHTML=viewTop();var nt=w.querySelector("header.top");if(nt)t.replaceWith(nt);var p=document.querySelector(".npop");if(p)p.remove();if(st.bell)document.body.insertAdjacentHTML("beforeend",viewBell());placePop();}

    (perm==="granted"?'<small>Alertas no computador ativos</small>':perm==="denied"?'<small>Alertas bloqueados no navegador</small>':perm==="unsupported"?'':'<button class="btn btn-line btn-sm" data-a="notif-perm">Ativar alertas no computador</button>')+'</div>'+
    '<small>Os alertas funcionam enquanto o painel estiver aberto (pode estar noutro separador). Por email recebes sempre.</small></div></div>';
}
function save(col,item){
  var list=st.data[col],i=list.findIndex(function(x){return x.id===item.id;});
  if(i>-1)list[i]=item;else list.unshift(item);render();
  return api("POST","",{col:col,item:item}).then(function(j){var k=list.findIndex(function(x){return x.id===item.id;});if(k>-1)list[k]=j.item;return j.item;})
    .catch(function(e){toast("Não foi possível guardar: "+e.message);load(true);throw e;});

function remove(col,id){
  st.data[col]=st.data[col].filter(function(x){return x.id!==id;});render();
  return api("DELETE","?col="+col+"&id="+encodeURIComponent(id)).catch(function(e){toast("Não foi possível apagar: "+e.message);load(true);});

function billing(key){
  var once=0,n=0,mo=0,nm=0;
  st.data.projects.forEach(function(p){
    if(p.faturadoEm&&p.faturadoEm.slice(0,7)===key){once+=(+p.valor||0);n++;}
    var start=String(p.faturadoEm||p.createdAt||"").slice(0,7);
    if(+p.mensal>0&&start&&start<=key){mo+=(+p.mensal||0);nm++;}
  });
  return {once:once,n:n,mo:mo,nm:nm,total:once+mo};
}
function monthName(key,short){var parts=key.split("-"),dt=new Date(+parts[0],+parts[1]-1,1);return dt.toLocaleDateString("pt-PT",short?{month:"short"}:{month:"long",year:"numeric"}).replace(".","");}
function viewBilling(){
  var now=new Date(),keys=[];for(var i=5;i>=0;i--)keys.push(monthKey(new Date(now.getFullYear(),now.getMonth()-i,1)));
  var vals=keys.map(billing),cur=vals[5],prev=vals[4],max=Math.max.apply(null,vals.map(function(v){return v.total;}).concat([1]));
  var delta=prev.total?Math.round((cur.total-prev.total)/prev.total*100):null;
  var dtxt=prev.total?('<b>'+(delta>=0?"+":"")+delta+'%</b> face a '+monthName(keys[4]).split(" ")[0]+' ('+fmt(prev.total)+')'):(cur.total?"Primeiro mês com faturação registada.":"Ainda sem faturação registada este mês.");
  return '<section class="panel bill" aria-label="Faturação mensal"><div class="lft"><span class="label">Faturação mensal · '+esc(monthName(keys[5]))+'</span>'+
    '<span class="big">'+fmt(cur.total)+'</span><span class="delta">'+dtxt+'</span>'+
    '<div class="split"><div><span>Projetos faturados ('+cur.n+')</span><span>'+fmt(cur.once)+'</span></div><div><span>Manutenções ('+cur.nm+')</span><span>'+fmt(cur.mo)+'</span></div></div></div>'+
    '<div><div class="bars" role="img" aria-label="Faturação dos últimos 6 meses: '+keys.map(function(k,i){return monthName(k,true)+" "+fmt(vals[i].total);}).join(", ")+'">'+
    keys.map(function(k,i){var v=vals[i],h=Math.round(v.total/max*100);return '<div class="bar'+(i===5?" cur":"")+'" style="--h:'+h+'%" tabindex="0" aria-label="'+esc(monthName(k))+': '+fmt(v.total)+'">'+
      (i===5&&v.total?'<span class="v">'+fmt(v.total)+'</span>':'')+'<span class="tip">'+esc(monthName(k))+' · '+fmt(v.total)+(v.mo?' (inclui '+fmt(v.mo)+' de manutenções)':'')+'</span><i style="height:'+h+'%"></i></div>';}).join("")+
    '</div><div class="mlabels">'+keys.map(function(k,i){return '<span class="'+(i===5?"cur":"")+'">'+esc(monthName(k,true))+'</span>';}).join("")+'</div></div></section>';
}

  if(act==="inv-open"){var iv=st.data.invites.filter(function(x){return x.token===a.dataset.id;})[0];if(iv)openDrawer("invite",null,{inv:iv});return;}
  if(act==="inv-del"){st.data.invites=st.data.invites.filter(function(x){return x.token!==a.dataset.id;});render();api("DELETE","?col=invites&id="+encodeURIComponent(a.dataset.id)).catch(function(){load(true);});toast("Link cancelado.");return;}
  if(act==="t-status"){var tt=st.data.testimonials.filter(function(x){return x.id===a.dataset.id;})[0];if(!tt)return;tt.status=a.dataset.st;render();
    api("POST","",{action:"testimonial",id:tt.id,status:tt.status}).then(function(){toast(tt.status==="approved"?"Publicado no site.":"Escondido do site.");}).catch(function(e){toast("Erro: "+e.message);load(true);});return;}
  if(act==="t-del"){if(!confirmDel())return;st.data.testimonials=st.data.testimonials.filter(function(x){return x.id!==a.dataset.id;});render();api("DELETE","?col=testimonials&id="+encodeURIComponent(a.dataset.id)).catch(function(){load(true);});toast("Testemunho apagado.");return;}
  if(act==="copy-txt"){var tx=a.dataset.txt;try{navigator.clipboard.writeText(tx).then(function(){toast("Copiado.");});}catch(x){toast("Não foi possível copiar.");}return;}
  if(act==="demo"){st.demo=true;DEMO=null;load();return;}
  if(act==="logout"){st.key="";st.demo=false;st.data={leads:[],clients:[],projects:[],users:[],notifs:[],testimonials:[],invites:[]};st.drawer=null;st.bell=false;st.known=null;try{sessionStorage.removeItem("bm-admin-key");}catch(x){}render();return;}
  if(act==="reload"){load();return;}
  if(act==="close"){closeDrawer();return;}
  if(act==="new-client"){openDrawer("client",null);return;}
  if(act==="new-project"){openDrawer("project",null,{clientId:a.dataset.client||""});return;}
  if(act==="save-lead-notes"){var l=byId("leads",a.dataset.id);l.notes=document.getElementById("lnotes").value;save("leads",Object.assign({},l)).then(function(){toast("Notas guardadas.");});return;}
  if(act==="convert"){convert(a.dataset.id);return;}
  if(act==="wa-open"){st.wa.pending=true;setTimeout(render,60);return;}
  if(act==="wa-cancel"){st.wa.pending=false;render();return;}
  if(act==="wa-log"){var wl=byId("leads",st.wa.leadId);if(!wl)return;var tp=TPLS.filter(function(x){return x[0]===st.wa.tpl;})[0];
    var upd=Object.assign({},wl,{history:(wl.history||[]).concat([{at:new Date().toISOString(),kind:st.wa.tpl,text:st.wa.text,via:"whatsapp"}])});
    if(tp&&!(wl.status==="aceite"&&tp[2]!=="recusado"))upd.status=tp[2];
    st.wa.pending=false;save("leads",upd).then(function(){toast("Mensagem registada. Estado: "+label(LEAD_STATUS,upd.status)+".");});return;}
  if(act==="ask-delete"){st.confirm=a.dataset.kind;render();return;}
  if(act==="cancel-delete"){st.confirm=null;render();return;}
  if(act==="do-delete"){var D=st.drawer,col=D.type==="lead"?"leads":D.type==="client"?"clients":"projects";remove(col,D.id);st.drawer=null;st.confirm=null;render();toast("Apagado.");return;}
});
document.addEventListener("change",function(e){
  var t=e.target;
  if(t.id==="snd"){sound=t.checked;try{localStorage.setItem("bm-admin-sound",sound?"on":"off");}catch(x){}if(sound)chime();return;}
  if(t.dataset&&t.dataset.leadStatus){var l=byId("leads",t.dataset.leadStatus);save("leads",Object.assign({},l,{status:t.value})).then(function(){toast("Estado atualizado.");});}
});
document.addEventListener("input",function(e){if(e.target.id==="q"){st.q=e.target.value;render();}
  if(e.target.id==="wamsg"&&st.wa){st.wa.text=e.target.value;var g=document.getElementById("wago"),ll=byId("leads",st.wa.leadId);if(g&&ll)g.href=waHref(ll,st.wa.text);}});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&st.drawer){closeDrawer();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".row[data-open],.pcard[data-open]")){e.preventDefault();openDrawer(e.target.dataset.open,e.target.dataset.id);}
});
setInterval(function(){if((st.key||st.demo)&&!st.loading)load(true);},30000);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&st.key)load(true);});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&st.bell){st.bell=false;renderTop();}});
window.addEventListener("resize",placePop);

if(window.BM_DEMO){st.demo=true;load();}else if(st.key)load();else{render();checkStatus();}
})();
</script>
</body>
</html>
