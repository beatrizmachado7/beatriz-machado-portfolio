<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#F3EDE4"><title>Painel — Beatriz Machado</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="preload" href="/assets/fonts/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin><style>@font-face{font-family:"Outfit";src:url(/assets/fonts/outfit-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Inclusive Sans";src:url(/assets/fonts/inclusive-sans-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Inclusive Sans";src:url(/assets/fonts/inclusive-sans-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
:root{
  --bg:#F3EDE4;--bg2:#ECE3D6;--card:#FBF8F3;--ink:#1A1A1A;--mut:#5B534B;--line:#DDD2C2;--line2:#CBBDA9;
  --terra:#C26A4A;--tink:#9A4B2E;--tbtn:#A65135;--tsoft:#F2DED2;--dark:#1A1A1A;
  --ok:#2F6B47;--oksoft:#DCEBDF;--new:#9A4B2E;
  --serif:"Outfit",system-ui,sans-serif;--sans:"Inclusive Sans",system-ui,sans-serif;
  --ease:cubic-bezier(.22,.8,.24,1);--r:22px;--sbw:256px;--hh:56px
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.02em;margin:0}
:focus-visible{outline:2px solid var(--tbtn);outline-offset:2px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* efeitos do site */
.glow{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;transition:opacity .6s;mix-blend-mode:multiply;background:radial-gradient(520px circle at var(--mx,50%) var(--my,20%),rgba(194,106,74,.14),transparent 45%)}
.hasmouse .glow{opacity:1}
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(60px);animation:orb 12s ease-in-out infinite}
.orb.a{width:460px;height:460px;left:-150px;top:170px;background:rgba(194,106,74,.12)}
.orb.b{width:520px;height:520px;right:-160px;top:340px;background:rgba(229,199,170,.22);animation-delay:-5s}
@keyframes orb{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(30px,-28px) scale(1.08)}}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.orb{animation:none}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* botões */
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 20px;border-radius:999px;font:600 14px/1 var(--sans);border:1px solid transparent;transition:background .25s,border-color .25s,transform .25s var(--ease),box-shadow .25s;white-space:nowrap}
.btn svg{width:16px;height:16px;flex:none}
.btn-p{background:var(--tbtn);color:#fff;box-shadow:0 10px 26px -14px rgba(166,81,53,.75)}
.btn-p:hover{background:var(--dark);transform:translateY(-1px)}
.btn-s{border-color:var(--line2);background:transparent}
.btn-s:hover{border-color:var(--ink);background:rgba(26,26,26,.04)}
.btn-d{background:var(--dark);color:#fff}
.btn-wa{background:#1F7A4D;color:#fff}.btn-wa:hover{background:#17603C}
.btn-x{color:#9B2C1F;border-color:#E5C3BA}.btn-x:hover{background:#F8E6E1}
.btn-sm{min-height:34px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.45;pointer-events:none}
.ib{all:unset;cursor:pointer;display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);transition:background .2s,border-color .2s}
.ib:hover{border-color:var(--ink);background:rgba(26,26,26,.04)}
.ib svg{width:18px;height:18px}
.lk{all:unset;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--tink)}
.lk:hover{text-decoration:underline}

/* formulários */
.in{width:100%;min-height:44px;padding:10px 14px;border-radius:14px;border:1px solid var(--line2);background:#fff;transition:border-color .2s,box-shadow .2s}
.in:focus{outline:none;border-color:var(--tbtn);box-shadow:0 0 0 3px rgba(166,81,53,.15)}
textarea.in{resize:vertical;line-height:1.55}
.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mut)}
.err{color:#9B2C1F;font-size:13.5px;min-height:1em}

/* login */
.login{position:relative;z-index:2;min-height:100vh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:40px 34px;box-shadow:0 40px 80px -50px rgba(26,26,26,.4);animation:up .5s var(--ease)}
.login-card .wm{height:26px;display:block;margin-bottom:28px}
.login-card h1{font-size:30px;margin-bottom:6px}
.login-card p{color:var(--mut);margin:0 0 22px}
.login-card form{display:flex;flex-direction:column;gap:12px}
.login-card .row{display:flex;gap:10px;flex-wrap:wrap}
.login-card .row .btn{flex:1}
.setup{background:var(--tsoft);border-radius:14px;padding:12px 14px;font-size:13.5px;color:var(--tink);margin-top:14px}

/* estrutura */
.app{position:relative;z-index:2;display:grid;grid-template-columns:var(--sbw) minmax(0,1fr);min-height:100vh}
.sb{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:28px 18px 20px;border-right:1px solid var(--line);background:rgba(251,248,243,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.sb .wm{height:21px;margin:0 10px 30px;display:block}
.nav{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:14px;font-weight:600;font-size:14.5px;color:var(--mut);transition:background .2s,color .2s}
.nav svg{width:19px;height:19px;flex:none}
.nav:hover{background:rgba(26,26,26,.05);color:var(--ink)}
.nav.on{background:var(--dark);color:#fff}
.nav .bd{margin-left:auto;min-width:22px;height:22px;padding:0 7px;border-radius:999px;background:var(--terra);color:#fff;font-size:12px;display:grid;place-items:center}
.nav .bd[hidden]{display:none}
.nav.on .bd{background:#fff;color:var(--ink)}
.sb-sep{height:1px;background:var(--line);margin:12px 8px}
.sb-label{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:4px 12px}
.sb-foot{margin-top:auto;display:flex;flex-direction:column;gap:4px}
.sb-foot .nav{font-size:13.5px;padding:9px 12px}
.who-tag{margin:0 10px 8px;font-size:12.5px;color:var(--mut)}
.home.h2c{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.demo-tag{margin:0 10px 10px;padding:8px 12px;border-radius:12px;background:var(--tsoft);color:var(--tink);font-size:12.5px;font-weight:600}
.main{min-width:0;padding:40px clamp(18px,4vw,56px) 80px}
.mtop{display:none}
.view{animation:up .45s var(--ease)}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.eb{display:block;font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--tink);margin-bottom:8px}
.head h1{font-size:clamp(32px,4vw,48px);line-height:1.02}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.card h2{font-size:20px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.empty{padding:26px;border:1px dashed var(--line2);border-radius:var(--r);color:var(--mut);text-align:center;font-size:14.5px}
.muted{color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--bg2);color:var(--mut);white-space:nowrap}
.chip.new{background:var(--tsoft);color:var(--tink)}
.chip.new::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--terra)}
.chip.ok{background:var(--oksoft);color:var(--ok)}
.chip.rep{background:#E7E3F2;color:#4B3F7A}

/* agenda */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:22px}
.wd{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:12px 4px 10px;border-radius:18px;border:1px solid var(--line);background:var(--card);transition:border-color .2s,background .2s,transform .25s var(--ease)}
.wd:hover{border-color:var(--ink);transform:translateY(-2px)}
.wd small{display:block;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.wd b{display:block;font:500 24px/1.2 var(--serif);margin-top:2px}
.wd i{display:block;height:6px;margin-top:4px}
.wd i::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--terra);opacity:0}
.wd.has i::after{opacity:1}
.wd.today b{color:var(--tink)}
.wd.on{background:var(--dark);border-color:var(--dark);color:#fff}
.wd.on small,.wd.on.today b{color:rgba(255,255,255,.75)}
.wd.on b{color:#fff}
.ag{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
.tl{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px 14px 8px 0;overflow:hidden}
.tl-in{position:relative;margin-left:62px}
.hr{position:relative;height:var(--hh);border-top:1px solid var(--line)}
.hr:first-child{border-top-color:transparent}
.hr span{position:absolute;left:-58px;top:-9px;width:48px;text-align:right;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.slot{all:unset;position:absolute;inset:0;cursor:copy;border-radius:10px;transition:background .15s}
.slot:hover{background:rgba(194,106,74,.07)}
.slot:hover::after{content:"+ Adicionar";position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;color:var(--tink)}
.ev{position:absolute;z-index:2;border-radius:12px;background:var(--tsoft);border-left:4px solid var(--terra);padding:6px 10px 6px 8px;display:flex;gap:8px;align-items:flex-start;overflow:hidden;box-shadow:0 0 0 2px var(--card);transition:transform .2s var(--ease),box-shadow .2s}
.ev:hover{transform:translateY(-1px);box-shadow:0 0 0 2px var(--card),0 10px 24px -14px rgba(26,26,26,.45)}
.ev.done{background:var(--bg2);border-left-color:var(--line2)}
.ev.done .evt{text-decoration:line-through;color:var(--mut)}
.ev.dk{background:#2A2624;color:#fff;border-left-color:var(--terra)}
.ev.dk .evm{color:rgba(255,255,255,.7)}
.evb{all:unset;cursor:pointer;flex:1;min-width:0}
.evt{display:block;font-weight:600;font-size:13.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.evm{display:block;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
.ck{appearance:none;-webkit-appearance:none;flex:none;width:20px;height:20px;margin:0;border-radius:7px;border:1.5px solid var(--line2);background:#fff;cursor:pointer;display:grid;place-items:center;transition:background .2s,border-color .2s}
.ck:checked{background:var(--ok);border-color:var(--ok)}
.ck:checked::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.now{position:absolute;left:-8px;right:0;height:2px;background:var(--terra);z-index:3;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--terra)}
.side{display:flex;flex-direction:column;gap:18px;position:sticky;top:24px}
.qa{display:flex;flex-direction:column;gap:10px}
.qa .r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tasks li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.tasks li:first-child{border-top:0}
.tasks li.done .tt{text-decoration:line-through;color:var(--mut)}
.tasks .tt{all:unset;cursor:pointer;flex:1;min-width:0;font-size:14.5px}
.tasks .tt small{display:block;color:var(--mut);font-size:12px}
.x{all:unset;cursor:pointer;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--mut);font-size:18px;line-height:1}
.x:hover{background:rgba(26,26,26,.06);color:var(--ink)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini button{all:unset;cursor:pointer;box-sizing:border-box;padding:14px;border-radius:16px;background:var(--bg);transition:background .2s}
.mini button:hover{background:var(--bg2)}
.mini small{display:block;font-size:12px;color:var(--mut);font-weight:600}
.mini b{display:block;font:500 24px/1.2 var(--serif);margin-top:4px;font-variant-numeric:tabular-nums}

/* início */
.welcome{margin-bottom:28px}
.welcome h1{font-size:clamp(38px,5vw,64px);line-height:1;letter-spacing:-.03em}
.welcome p{margin:12px 0 0;font-size:17px;color:var(--mut);max-width:60ch}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kb{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;transition:border-color .2s,transform .25s var(--ease)}
.kb:hover{border-color:var(--ink);transform:translateY(-2px)}
.home{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.hcol{display:flex;flex-direction:column;gap:22px;min-width:0}
.card h2 .mnav{gap:6px}.card h2 .mnav b{font-size:15px;min-width:130px}.card h2 .ib{width:34px;height:34px}
/* resumo */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:22px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px}
.kpi small{display:block;font-size:13px;font-weight:600;color:var(--mut)}
.kpi b{display:block;font:500 clamp(30px,3.4vw,42px)/1.1 var(--serif);letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums}
.kpi span span{display:inline;margin:0}
.kpi>span{display:block;font-size:13px;color:var(--mut);margin-top:6px}
.kpi.hero{background:var(--dark);border-color:var(--dark);color:#fff}
.kpi.hero small,.kpi.hero span{color:rgba(255,255,255,.72)}
.up{color:var(--ok)!important;font-weight:600}.down{color:#B2442C!important;font-weight:600}
.kpi.hero .up{color:#9FD8B4!important}.kpi.hero .down{color:#F0A991!important}
.chart{position:relative;margin-top:6px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{font-size:11px;fill:var(--mut);font-family:var(--sans)}
.chart .bar{fill:var(--terra);transition:opacity .15s}
.chart .bar.z{fill:var(--line)}
.chart .hit{fill:transparent;cursor:default}
.chart .hit:hover+.bar,.chart g:hover .bar{opacity:.75}
.mnav{display:flex;align-items:center;gap:8px}
.mnav b{font:500 18px/1 var(--serif);min-width:150px;text-align:center}

/* listas */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fb{all:unset;cursor:pointer;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:background .2s,border-color .2s}
.fb:hover{border-color:var(--ink)}
.fb.on{background:var(--dark);border-color:var(--dark);color:#fff}
.fb span{opacity:.65;font-variant-numeric:tabular-nums}
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mut)}
.search .in{padding-left:40px;min-width:240px;border-radius:999px}
.list{display:flex;flex-direction:column;gap:10px}
.li{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:44px minmax(0,1.4fr) minmax(0,1.2fr) auto auto;gap:16px;align-items:center;padding:14px 18px;border-radius:20px;background:var(--card);border:1px solid var(--line);transition:border-color .2s,transform .25s var(--ease),box-shadow .25s}
.li:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 18px 34px -26px rgba(26,26,26,.45)}
.li.unseen{border-color:#E3B9A6;background:#FDF6F1}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);font:500 17px/1 var(--serif);color:var(--tink)}
.li .nm b{display:block;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .nm span,.li .sv span{display:block;font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .sv b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .tg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.li .am{font:500 18px/1 var(--serif);font-variant-numeric:tabular-nums;text-align:right;min-width:70px}
.cl{grid-template-columns:44px minmax(0,1.4fr) minmax(0,1.2fr) 90px 110px}
.cl .num{font-variant-numeric:tabular-nums;text-align:right}
.lh{display:grid;gap:16px;padding:0 18px 8px;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}

/* gaveta */
.ov{position:fixed;inset:0;z-index:40;background:rgba(26,26,26,.32);backdrop-filter:blur(2px);animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dr{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(560px,100vw);background:var(--bg);border-left:1px solid var(--line);overflow:auto;padding:28px 28px 60px;display:flex;flex-direction:column;gap:18px;animation:slide .35s var(--ease)}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.dh h2{font-size:30px;line-height:1.08}
.dh p{margin:6px 0 0;color:var(--mut);font-size:14px}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px 16px;margin:0;font-size:14.5px}
.kv dt{color:var(--mut);font-size:13px;font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.sec>h3{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.tpls{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tpl{all:unset;cursor:pointer;height:32px;padding:0 13px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:13px;font-weight:600;transition:border-color .2s,background .2s}
.tpl:hover{border-color:var(--ink)}
.tpl.on{background:var(--tsoft);border-color:#E3B9A6;color:var(--tink)}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.sw{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;cursor:pointer;min-height:44px}
.sw input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--line2);position:relative;cursor:pointer;transition:background .2s;margin:0;flex:none}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.sw input:checked{background:var(--ok)}
.sw input:checked::after{transform:translateX(18px)}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hist li{padding:12px 14px;border-radius:14px;background:var(--bg);font-size:13.5px;white-space:pre-wrap}
.hist li small{display:block;font-weight:600;color:var(--mut);margin-bottom:4px;white-space:normal}
.msg{white-space:pre-wrap;background:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;margin:0}

/* quadros */
.boards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;align-items:start}
.bd-h{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}
.bd-h h3{font-size:20px}
.bd-h p{margin:2px 0 0;color:var(--mut);font-size:13px}
.prog{height:6px;border-radius:999px;background:var(--bg2);overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .4s var(--ease)}
.tadd{display:flex;gap:8px;margin-top:10px}
.tadd .in{min-height:38px;border-radius:12px}
.bd-f{display:flex;justify-content:space-between;margin-top:12px}

/* testemunhos */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-bottom:28px}
.tc q{display:block;font:400 17px/1.45 var(--serif);margin:12px 0}
.tc .who{font-size:13.5px;color:var(--mut);margin-bottom:12px}
.sub{font-size:20px;margin:6px 0 14px}
.linkbox{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}

/* tooltip & toast */
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--dark);color:#fff;font-size:12.5px;padding:7px 10px;border-radius:10px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));opacity:0;transition:opacity .12s}
#tip.on{opacity:1}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;background:var(--dark);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;box-shadow:0 20px 40px -20px rgba(0,0,0,.5);animation:up .3s var(--ease)}

/* responsivo */
@media (max-width:1180px){.home,.home.h2c{grid-template-columns:minmax(0,1fr)}.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.ag{grid-template-columns:minmax(0,1fr)}.side{position:static;order:-1}.li{grid-template-columns:44px minmax(0,1fr) auto}.li .sv,.li .tg{display:none}.cl{grid-template-columns:44px minmax(0,1fr) 110px}.cl .sv,.cl .np{display:none}.lh{display:none}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sb{position:fixed;left:0;top:0;bottom:0;z-index:50;width:280px;transform:translateX(-100%);transition:transform .3s var(--ease);background:var(--card)}
  .app.menu .sb{transform:none;box-shadow:30px 0 60px -30px rgba(0,0,0,.4)}
  .app.menu::after{content:"";position:fixed;inset:0;z-index:45;background:rgba(26,26,26,.3)}
  .mtop{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:30;padding:12px 16px;background:rgba(243,237,228,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .mtop .wm{height:18px}
  .main{padding:22px 16px 70px}
  .kpis{grid-template-columns:1fr}.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi,.kb{padding:16px 18px}.card h2{flex-wrap:wrap}
  .week{gap:5px}.wd{padding:10px 2px 8px;border-radius:14px}.wd b{font-size:19px}.wd small{font-size:10.5px;letter-spacing:.02em}
  .dr{padding:22px 16px 60px}
  .kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}
  .pay{grid-template-columns:1fr}
  .search .in{min-width:0}
  .tools{width:100%}.tools .search{flex:1}
}

/* ---------- utilitários ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function pad(n){return String(n).padStart(2,"0");}
function ymd(x){return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate());}
function pYmd(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+(p[2]||1));}
function addDays(s,n){var x=pYmd(s);x.setDate(x.getDate()+n);return ymd(x);}
function today(){return ymd(new Date());}
function eur(n){n=+n||0;return n.toLocaleString("pt-PT",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})+"€";}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function dLong(s){return cap(pYmd(s).toLocaleDateString("pt-PT",{weekday:"long",day:"numeric",month:"long"}));}
function dShort(iso,withTime){if(!iso)return "—";var x=new Date(iso);if(isNaN(x))return esc(iso);var o={day:"numeric",month:"short"};if(x.getFullYear()!==new Date().getFullYear())o.year="numeric";var s=x.toLocaleDateString("pt-PT",o);if(withTime)s+=", "+x.toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});return s;}
function monthName(m){return cap(pYmd(m+"-01").toLocaleDateString("pt-PT",{month:"long",year:"numeric"}));}
function ago(iso){var s=(Date.now()-new Date(iso))/1e3;if(s<60)return "agora";if(s<3600)return "há "+Math.floor(s/60)+" min";if(s<86400)return "há "+Math.floor(s/3600)+" h";if(s<2*86400)return "ontem";if(s<7*86400)return "há "+Math.floor(s/86400)+" dias";return dShort(iso);}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);}
function first(n){return String(n||"").trim().split(/\s+/)[0]||"";}
function initial(n){return (first(n).charAt(0)||"?").toUpperCase();}
function waNum(t){var n=String(t||"").replace(/\D/g,"");if(!n)return "";if(n.length===9)n="351"+n;return n;}
function toMin(t){var p=String(t||"").split(":");return (+p[0])*60+(+p[1]||0);}
function fromMin(m){return pad(Math.floor(m/60))+":"+pad(m%60);}
function svc(l){return l.categoria?l.categoria+(l.subcategoria?" · "+l.subcategoria:""):(l.plano||String(l.servico||"").split(" — ").join(" · ")||"—");}
function toast(m){var e=document.getElementById("toast");if(e)e.remove();e=document.createElement("div");e.id="toast";e.setAttribute("role","status");e.textContent=m;document.body.appendChild(e);setTimeout(function(){e.remove();},2800);}

/* ---------- API ---------- */
function api(method,qs,body){
  if(st.demo)return Promise.resolve(demoApi(method,qs,body));
  return fetch("/api/admin"+(qs||""),{method:method,headers:Object.assign({"content-type":"application/json"},st.key?{authorization:"Bearer "+st.key}:{}),body:body?JSON.stringify(body):undefined})
    .then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok){var e=new Error(j.error||("Erro "+r.status));e.status=r.status;throw e;}return j;});});
}
function pubPost(body){if(st.demo)return Promise.resolve(demoApi("POST","",body));return fetch("/api/admin",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok)throw new Error(j.error||("Erro "+r.status));return j;});});}
function doLogin(email,pw,remember){st.loginErr="";return pubPost({action:"login",email:email,password:pw}).then(function(j){setToken(j.token,remember);st.me=j.me;st.view="inicio";return load();});}
function busy(){var a=document.activeElement;return !!(st.drawer||st.menu||(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.value));}
function load(silent){
  if(!silent){st.loading=true;render();}
  return api("GET").then(function(j){
    var D=empty();Object.keys(D).forEach(function(k){D[k]=j[k]||[];});D.leads.forEach(function(l){if(l.visto===undefined&&l.status&&l.status!=="novo")l.visto=true;});
    var fresh=st.known?D.leads.filter(function(l){return st.known.indexOf(l.id)<0;}):[];
    st.known=D.leads.map(function(l){return l.id;});
    st.data=D;st.me=j.me||st.me||null;st.loading=false;if(!isOwner()&&st.view==="testemunhos"||!isOwner()&&st.view==="equipa")st.view="inicio";
    if(silent&&busy())paintBadges();else render();
    if(fresh.length)alertNew(fresh);
    setTitle();
  }).catch(function(e){st.loading=false;
    if(silent&&e.status!==401)return;
    clearToken();st.me=null;
    st.loginErr=e.status===401?"A tua sessão terminou. Entra de novo.":e.message;checkStatus();render();});
}
function checkStatus(){if(st.demo)return;fetch("/api/status").then(function(r){return r.json();}).then(function(j){st.status=j;if(!st.key)render();},function(){st.status={offline:true};if(!st.key)render();});}
function save(col,item,quiet){
  var L=st.data[col],i=L.findIndex(function(x){return x.id===item.id;});
  if(i>-1)L[i]=item;else L.unshift(item);
  if(!quiet)render();
  return api("POST","",{col:col,item:item}).then(function(j){var k=L.findIndex(function(x){return x.id===item.id;});if(k>-1)L[k]=j.item;return j.item;})
    .catch(function(e){toast("Não foi possível guardar: "+e.message);load(true);throw e;});
}
function remove(col,id){st.data[col]=st.data[col].filter(function(x){return x.id!==id;});render();
  return api("DELETE","?col="+col+"&id="+encodeURIComponent(id)).catch(function(e){toast("Não foi possível apagar: "+e.message);load(true);});}

/* ---------- agenda ---------- */
function agendaOf(day){return st.data.agenda.filter(function(a){return a.date===day;});}
function layoutEvents(evs){
  evs=evs.slice().sort(function(a,b){return toMin(a.time)-toMin(b.time)||(b.dur||60)-(a.dur||60);});
  var out=[],cluster=[],cols=[],cEnd=-1;
  function flush(){var n=cols.length;cluster.forEach(function(o){o.n=n;});cluster=[];cols=[];}
  evs.forEach(function(e){var s=toMin(e.time),en=s+Math.max(+e.dur||60,20);
    if(s>=cEnd){flush();cEnd=en;}else cEnd=Math.max(cEnd,en);
    var c=0;while(c<cols.length&&cols[c]>s)c++;cols[c]=en;var o={e:e,s:s,en:en,c:c};cluster.push(o);out.push(o);});
  flush();return out;
}

function chart(m,W){var P=paid().filter(function(l){return l.pagoEm.slice(0,7)===m;});W=Math.max(Math.round(W||760),260);
  var days=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate(),v=[];for(var i=0;i<days;i++)v.push(0);
  P.forEach(function(l){v[+l.pagoEm.slice(8,10)-1]+=(+l.valor||0);});
  var max=Math.max.apply(null,v),H=W<500?170:200,pl=44,pb=26,pt=10,cw=(W-pl)/days,bw=Math.max(cw-4,3);
  var nice=max<=0?100:Math.pow(10,Math.floor(Math.log10(max)));var top=Math.ceil(max/nice)*nice;if(top/nice<=2)top=Math.ceil(max/(nice/2))*(nice/2);if(!top)top=100;
  var s='<div class="chart" data-m="'+m+'"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Faturação diária em '+esc(monthName(m))+'">';
  [0,.5,1].forEach(function(f){var y=pt+(H-pb-pt)*(1-f);s+='<line class="gl" x1="'+pl+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(pl-8)+'" y="'+(y+4)+'" text-anchor="end">'+esc(eur(top*f))+'</text>';});
  v.forEach(function(val,i){var x=pl+i*cw+(cw-bw)/2,h=val>0?Math.max((H-pb-pt)*val/top,4):2,y=H-pb-h,tip=(i+1)+" "+pYmd(m+"-01").toLocaleDateString("pt-PT",{month:"short"}).replace(".","")+": "+eur(val);
    s+='<g data-tip="'+esc(tip)+'"><rect class="hit" x="'+(pl+i*cw)+'" y="'+pt+'" width="'+cw+'" height="'+(H-pb-pt)+'"/><path class="bar'+(val>0?"":" z")+'" d="'+barPath(x,y,bw,h,val>0?Math.min(4,bw/2):1)+'"/></g>';

/* ---------- eventos ---------- */
document.addEventListener("click",function(ev){
  var g=ev.target.closest("[data-go]");if(g){if(g.dataset.f)st.filter=g.dataset.f;go(g.dataset.go);return;}
  var dd=ev.target.closest("[data-day]");if(dd){st.day=dd.dataset.day;render();return;}
  var sl=ev.target.closest("[data-slot]");if(sl){st.qtime=sl.dataset.slot;render();var t=document.getElementById("qat");if(t){t.focus();t.scrollIntoView({block:"center",behavior:"smooth"});}return;}
  var fb=ev.target.closest("[data-f]");if(fb){st.filter=fb.dataset.f;render();return;}
  var tp=ev.target.closest("[data-tpl]");if(tp){st.tpl=tp.dataset.tpl;st.msg=null;st.subj=null;render();return;}
  var a=ev.target.closest("[data-a]");if(!a)return;var act=a.dataset.a,id=a.dataset.id;
  if(act==="close"){closeDrawer();return;}
  if(act==="menu"){st.menu=!st.menu;render();return;}
  if(act==="demo"){st.demo=true;DEMO=null;DEMO_ROLE="owner";st.me=null;st.view="inicio";st.day=today();load();return;}
  if(act==="demo-role"){DEMO_ROLE=DEMO_ROLE==="owner"?"member":"owner";st.me=null;st.view="inicio";st.drawer=null;st.known=null;load();toast(DEMO_ROLE==="owner"?"A ver como Beatriz.":"A ver como a Sara (colaboradora).");return;}
  if(act==="ls-back"){st.ls={step:"email",email:""};st.loginErr="";render();return;}
  if(act==="ls-reset"||act==="ls-resend"){var le=st.ls&&st.ls.email;if(!le)return;startLogin(le,true).then(function(){toast("Enviei um código para "+le+".");}).catch(function(e){st.loginErr=e.message;render();});return;}
  if(act==="inv-cancel"){INVITE="";history.replaceState(null,"",location.pathname);render();checkStatus();return;}
  if(act==="staff-new"){openDrawer("staff",null);return;}
  if(act==="staff-link"){var sm=st.data.staff.filter(function(x){return x.id===id;})[0];if(!sm)return;if(sm.active&&!confirm("Criar um link novo para "+sm.name+" definir outra palavra-passe? A palavra-passe atual continua a funcionar até ela criar a nova."))return;
    api("POST","",{action:"staff-link",id:id}).then(function(j){st.drawer={type:"staff",res:j};render();}).catch(function(e){toast("Erro: "+e.message);});return;}
  if(act==="staff-remove"){var sr=st.data.staff.filter(function(x){return x.id===id;})[0];if(!sr||!confirm("Remover o acesso de "+sr.name+"? Deixa de conseguir entrar no painel e a agenda dela é apagada."))return;
    st.data.staff=st.data.staff.filter(function(x){return x.id!==id;});render();api("POST","",{action:"staff-remove",id:id}).then(function(){toast("Acesso removido.");}).catch(function(e){toast("Erro: "+e.message);load(true);});return;}
  if(act==="logout"){if(st.key&&!st.demo)api("POST","",{action:"logout"}).catch(function(){});clearToken();st.me=null;st.demo=false;st.data=empty();st.drawer=null;st.known=null;st.view="inicio";render();checkStatus();return;}
  if(act==="sound"){sound=!sound;try{localStorage.setItem("bm-admin-sound",sound?"on":"off");}catch(e){}if(sound)chime();render();return;}
  if(act==="perm"){try{Notification.requestPermission().then(function(){render();});}catch(e){}return;}
  if(act==="copy"){copy(a.dataset.txt||"");return;}
  /* agenda */
  if(act==="day-prev"){st.day=addDays(st.day,-1);render();return;}
  if(act==="day-next"){st.day=addDays(st.day,1);render();return;}
  if(act==="day-today"){st.day=today();render();return;}
  if(act==="ag-open"){openDrawer("ag",id);return;}
  if(act==="ag-del"){var ag=byId("agenda",id);if(ag&&confirm("Apagar a tarefa “"+ag.title+"”?")){st.drawer=null;remove("agenda",id);}return;}
  if(act==="ag-late"){var al=byId("agenda",id);if(al)save("agenda",Object.assign({},al,{date:today()}));return;}
  if(act==="ag-late-all"){st.data.agenda.filter(function(x){return !x.done&&x.date<today()&&x.date>=addDays(today(),-14);}).forEach(function(x){save("agenda",Object.assign({},x,{date:today()}),true);});render();toast("Passadas para hoje.");return;}
  /* resumo */
  if(act==="m-prev"){st.month=prevMonth(st.month);render();return;}
  if(act==="m-next"){if(st.month<today().slice(0,7)){st.month=nextMonth(st.month);render();}return;}
  /* pedidos */
  if(act==="open-lead"){openDrawer("lead",id);return;}
  if(act==="open-client"){openDrawer("client",id);return;}
  if(act==="tpl-edit"){var back=st.drawer&&st.drawer.type==="lead"?st.drawer.id:null;openDrawer("tpl",null,{back:back});return;}
  if(act==="tpl-new"){save("templates",{id:"tpl-"+uid().slice(0,8),order:50,title:"Nova mensagem",subject:"",text:"Olá {nome}!\n\n\n\nBeatriz"});return;}
  if(act==="tpl-del"){var tt=templates().filter(function(x){return x.id===id;})[0];if(!tt||!confirm("Apagar a mensagem “"+tt.title+"”?"))return;
    if(DEF_TPL.some(function(x){return x.id===id;}))save("templates",Object.assign({},tt,{deleted:true}));else remove("templates",id);return;}
  if(act==="msg-copy"){copy(document.getElementById("mtext").value);return;}
  if(act==="send-mail"||act==="send-wa"){var L=byId("leads",st.drawer.id),tx=document.getElementById("mtext").value.trim(),sj=document.getElementById("msubj").value.trim();
    if(!tx){toast("Escreve ou escolhe uma mensagem primeiro.");return;}
    if(act==="send-wa"){window.open("https://wa.me/"+waNum(L.telefone)+"?text="+encodeURIComponent(tx),"_blank","noopener");
      var h=(L.history||[]).concat([{at:new Date().toISOString(),via:"whatsapp",text:tx,by:st.me?st.me.name:""}]);st.tpl=null;st.msg=null;st.subj=null;save("leads",Object.assign({},L,{history:h}));toast("Registado em mensagens enviadas.");return;}
    if(!confirm("Enviar este email para "+L.email+"?"))return;
    a.disabled=true;a.textContent="A enviar…";
    api("POST","",{action:"send-message",id:L.id,subject:sj||"Beatriz Machado",text:tx}).then(function(j){var i=st.data.leads.findIndex(function(x){return x.id===L.id;});if(i>-1&&j.item)st.data.leads[i]=j.item;st.tpl=null;st.msg=null;st.subj=null;render();toast("Email enviado para "+L.email+".");})
      .catch(function(e){toast("Não foi possível enviar: "+e.message);render();});return;}
  if(act==="lead-del"){var LD=byId("leads",st.drawer.id);if(LD&&confirm("Apagar o pedido de "+LD.nome+"? Não dá para desfazer.")){var lid=LD.id;st.drawer=null;remove("leads",lid);}return;}
  /* testemunhos */
  if(act==="inv-new"){openDrawer("invite",null);return;}
  if(act==="inv-open"){var iv=st.data.invites.filter(function(x){return x.token===id;})[0];if(iv)openDrawer("invite",null,{inv:iv});return;}

function demoApi(method,qs,body){if(!DEMO)DEMO=demoSeed();var J=function(x){return JSON.parse(JSON.stringify(x));};

  if(method==="GET"){var o=J(DEMO);o.me=ME;o.agenda=o.agenda.filter(function(a){return (a.uid||"owner")===DU;});
    if(DEMO_ROLE!=="owner"){o.leads.forEach(function(l){delete l.valor;delete l.pago;delete l.pagoEm;});["testimonials","invites","staff","users","notifs","boards"].forEach(function(k){o[k]=[];});}return o;}
